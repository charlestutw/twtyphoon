<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>台灣颱風即時監測 Taiwan Typhoon Watch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1220; --panel:#101B2Ecc; --panel-solid:#101B2E; --line:#1E3048;
    --txt:#E8EEF6; --dim:#8FA3BD; --cyan:#4FD8EB; --amber:#FFB454; --red:#FF5D5D;
    --green:#5DDE9B; --track:#FFD84F;
    --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Noto Sans TC',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);overflow:hidden}
  #map{position:absolute;inset:0;background:#0A1220}
  .leaflet-container{background:#0A1826;font-family:var(--sans)}

  /* ---- 頂部狀態列 ---- */
  header{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    background:linear-gradient(180deg,rgba(8,14,26,.92),rgba(8,14,26,.72) 70%,transparent);
    pointer-events:none;
  }
  header>*{pointer-events:auto}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand b{font-size:17px;font-weight:900;letter-spacing:.06em}
  .brand span{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase}
  #threatPill{
    display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
    font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--panel);
    backdrop-filter:blur(8px);white-space:nowrap;
  }
  #threatPill .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  #threatPill.lv1 .dot{background:var(--cyan)} #threatPill.lv1{border-color:#2b5b66}
  #threatPill.lv2 .dot{background:var(--green)}
  #threatPill.lv3{border-color:#6b5426;color:var(--amber)} #threatPill.lv3 .dot{background:var(--amber)}
  #threatPill.lv4{border-color:#7a3232;color:var(--red)} #threatPill.lv4 .dot{background:var(--red)}
  #threatPill.lv4 .dot, #threatPill.lv3 .dot{animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}100%{box-shadow:0 0 0 9px transparent}}
  .spacer{flex:1}
  #updated{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;line-height:1.5}
  #refreshBtn, #panelBtn{
    border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;
    padding:7px 12px;font-family:var(--sans);font-size:12px;cursor:pointer;backdrop-filter:blur(8px);
    white-space:nowrap;
  }
  #refreshBtn:hover, #panelBtn:hover{border-color:var(--cyan)}
  #panelBtn.on{border-color:var(--cyan);color:var(--cyan)}
  body.panel-hidden #panel{display:none}
  #refreshBtn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

  /* ---- 颱風資訊面板 ---- */
  #panel{
    position:absolute;top:64px;left:12px;z-index:1000;width:330px;max-width:calc(100vw - 24px);
    max-height:calc(100% - 170px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;
    scrollbar-width:thin;
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    backdrop-filter:blur(10px);
  }
  .card h2{font-size:16px;font-weight:900;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .card h2 .en{font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:500;letter-spacing:.08em}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .tag{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .tag.warn{color:var(--amber);border-color:#6b5426}
  .tag.sev{color:var(--red);border-color:#7a3232}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin-top:12px}
  .kv{display:flex;flex-direction:column;gap:1px}
  .kv label{font-size:10.5px;color:var(--dim);letter-spacing:.05em}
  .kv b{font-family:var(--mono);font-size:14.5px;font-weight:600}
  .kv b small{font-size:10.5px;color:var(--dim);font-weight:400}
  .approach{
    margin-top:12px;padding:10px 12px;border-radius:10px;background:#0c1524;
    border:1px dashed var(--line);font-size:12.5px;line-height:1.6;color:var(--dim);
  }
  .approach b{color:var(--txt);font-family:var(--mono)}
  .empty{color:var(--dim);font-size:13px;line-height:1.7}
  .empty b{color:var(--green)}
  .src{font-size:10.5px;color:var(--dim);line-height:1.7}
  .src a{color:var(--cyan);text-decoration:none}
  .src a:hover{text-decoration:underline}

  /* ---- 雷達播放列 ---- */
  #radarBar{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:1000;
    display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);
    max-width:calc(100vw - 24px);
  }
  #playBtn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line);flex:none;
    background:#0c1524;color:var(--cyan);font-size:13px;cursor:pointer;
  }
  #radarTime{font-family:var(--mono);font-size:12px;min-width:118px;text-align:center}
  #radarTime small{display:block;font-size:9.5px;color:var(--dim);letter-spacing:.1em}
  #frameSlider{width:150px;accent-color:var(--cyan)}
  #opacityWrap{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px}
  #opacitySlider{width:70px;accent-color:var(--cyan)}

  /* ---- 圖例 ---- */
  #legend{
    position:absolute;right:12px;bottom:14px;z-index:1000;padding:10px 13px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);
    font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:5px;
  }
  #legend .li{display:flex;align-items:center;gap:8px}
  #legend .sw{width:20px;height:0;border-top:3px solid;flex:none;border-radius:2px}
  #legend .cir{width:13px;height:13px;border-radius:50%;border:2px solid;flex:none;background:transparent}

  /* ---- 地圖標記 ---- */
  .tc-center{filter:drop-shadow(0 0 6px rgba(255,93,93,.8))}
  .tc-eye{width:100%;height:100%;border-radius:50%;border:2.5px solid #fff;background:var(--red);animation:pulse 1.6s ease-out infinite;color:var(--red)}
  .fc-dot{width:100%;height:100%;border-radius:50%;background:#fff;border:2px solid var(--track)}
  .home-dot{width:100%;height:100%;border-radius:50%;background:var(--cyan);border:2px solid #fff;box-shadow:0 0 8px rgba(79,216,235,.9)}
  .ap-dot{width:8px;height:8px;border-radius:50%;background:#B48CFF;border:1.5px solid #fff;box-shadow:0 0 6px rgba(180,140,255,.8)}
  .ap-label{position:absolute;left:12px;top:-4px;font-family:var(--mono);font-size:10px;color:#D9C8FF;text-shadow:0 1px 3px #000;white-space:nowrap}
  .ap-plane{font-size:17px;color:#D9C8FF;text-shadow:0 1px 4px #000;transform:rotate(18deg)}
  .tc-label{
    background:var(--panel-solid);border:1px solid var(--line);border-radius:6px;color:var(--txt);
    font-family:var(--mono);font-size:11px;padding:2px 7px;white-space:nowrap;font-weight:600;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .fc-label{background:transparent;border:none;color:#ffffffd9;font-family:var(--mono);font-size:10px;text-shadow:0 1px 3px #000;white-space:nowrap}
  .leaflet-popup-content-wrapper{background:var(--panel-solid);color:var(--txt);border:1px solid var(--line);border-radius:10px;font-size:12.5px}
  .leaflet-popup-tip{background:var(--panel-solid)}
  .leaflet-control-attribution{background:rgba(8,14,26,.7)!important;color:var(--dim)!important;font-size:9.5px!important}
  .leaflet-control-attribution a{color:var(--cyan)!important}
  .leaflet-bar a{background:var(--panel-solid)!important;color:var(--txt)!important;border-color:var(--line)!important}

  #err{
    position:absolute;top:64px;right:12px;z-index:1100;max-width:300px;display:none;
    background:#2a1420;border:1px solid #7a3232;color:#ffb9b9;border-radius:10px;
    padding:10px 13px;font-size:12px;line-height:1.6;
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:700px){
    header{gap:8px;padding:8px 10px}
    .brand b{font-size:14px} .brand span{display:none}
    #updated{display:none}
    #threatPill{font-size:11.5px;padding:5px 10px;overflow:hidden;text-overflow:ellipsis}
    #panelBtn,#refreshBtn{padding:6px 9px;font-size:11.5px}
    #panel{top:56px;left:8px;right:8px;width:auto;max-height:calc(100% - 140px)}
    #legend{display:none}
    #radarBar{bottom:10px;gap:8px;padding:7px 10px}
    #frameSlider{width:96px} #opacityWrap{display:none}
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="颱風監測地圖"></div>

<header>
  <div class="brand">
    <b>台灣颱風即時監測</b>
    <span>TAIWAN TYPHOON WATCH</span>
  </div>
  <div id="threatPill" class="lv0"><span class="dot"></span><span id="threatText">載入中…</span></div>
  <div class="spacer"></div>
  <div id="updated">—</div>
  <button id="panelBtn" aria-label="顯示或隱藏颱風資訊" aria-pressed="true">ⓘ 資訊</button>
  <button id="refreshBtn" aria-label="重新整理資料">↻ 更新</button>
</header>

<div id="err" role="alert"></div>

<aside id="panel" aria-label="颱風資訊面板"></aside>

<div id="radarBar" aria-label="雷達回波動畫控制">
  <button id="playBtn" aria-label="播放或暫停雷達動畫">▶</button>
  <input type="range" id="frameSlider" min="0" max="0" value="0" step="1" aria-label="雷達時間軸">
  <div id="radarTime"><span id="radarTimeMain">--:--</span><small>雷達回波（台灣時間）</small></div>
  <div id="opacityWrap">透明度 <input type="range" id="opacitySlider" min="10" max="100" value="70" aria-label="雷達透明度"></div>
</div>

<div id="legend">
  <div class="li"><span class="sw" style="border-color:#8FA3BD;border-top-style:dotted"></span>發展期路徑</div>
  <div class="li"><span class="sw" style="border-color:var(--track)"></span>颱風實際路徑</div>
  <div class="li"><span class="sw" style="border-color:#fff;border-top-style:dashed"></span>預測路徑</div>
  <div class="li"><span class="sw" style="border-color:#B48CFF;border-top-style:dotted"></span>高雄—東京航路</div>
  <div class="li"><span class="cir" style="border-color:#fff;border-style:dashed"></span>70% 預報圓</div>
  <div class="li"><span class="cir" style="border-color:var(--red)"></span>暴風圈（25 m/s）</div>
  <div class="li"><span class="cir" style="border-color:var(--amber)"></span>強風圈（15 m/s）</div>
</div>

  const toR = d => d*Math.PI/180;

  return 2*R_EARTH*Math.asin(Math.sqrt(s));
}

  const y = Math.sin(toR(b[1]-a[1]))*Math.cos(toR(b[0]));
  const x = Math.cos(toR(a[0]))*Math.sin(toR(b[0])) - Math.sin(toR(a[0]))*Math.cos(toR(b[0]))*Math.cos(toR(b[1]-a[1]));
  const deg = (Math.atan2(y,x)*180/Math.PI + 360) % 360;
  const dirs = ['北','北北東','東北','東北東','東','東南東','東南','南南東','南','南南西','西南','西南西','西','西北西','西北','北北西'];
  return dirs[Math.round(deg/22.5) % 16];
}
function minDistToTaiwan(pt){
  let best = {name:'', km:Infinity};
  for(const [name,la,lo] of TW_POINTS){
    const km = havKm(pt,[la,lo]);
    if(km < best.km) best = {name, km};
  }
  return best;
}
function fmtTW(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  const p = new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',weekday:'narrow',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
  const g = t => p.find(x=>x.type===t)?.value ?? '';
  return `${g('month')}/${g('day')}（${g('weekday')}） ${g('hour')}:${g('minute')}`;
}

/* ---- 高雄—東京 常規航路（大圓近似） ---- */
const KHH = [22.577,120.350], NRT = [35.765,140.386], HND = [35.549,139.780];
function gcPoints(a,b,n=48){
  const toR=d=>d*Math.PI/180, toD=r=>r*180/Math.PI;
  const la1=toR(a[0]),lo1=toR(a[1]),la2=toR(b[0]),lo2=toR(b[1]);
  const v1=[Math.cos(la1)*Math.cos(lo1),Math.cos(la1)*Math.sin(lo1),Math.sin(la1)];
  const v2=[Math.cos(la2)*Math.cos(lo2),Math.cos(la2)*Math.sin(lo2),Math.sin(la2)];
  const dot=Math.min(1,Math.max(-1,v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2]));
  const w=Math.acos(dot), sw=Math.sin(w), pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n, A=Math.sin((1-t)*w)/sw, B=Math.sin(t*w)/sw;
    const x=A*v1[0]+B*v2[0], y=A*v1[1]+B*v2[1], z=A*v1[2]+B*v2[2];
    pts.push([toD(Math.atan2(z,Math.hypot(x,y))), toD(Math.atan2(y,x))]);
  }
  return pts;
}

/* =========================== 颱風資料 =========================== */
let threatLevel = 0; // 0 無 1 遠距 2 觀察 3 警戒 4 嚴重

async function fetchJSON(url){
  const r = await fetch(url, {cache:'no-store'});
  if(!r.ok) throw new Error(`HTTP ${r.status} — ${url}`);
  return r.json();
}

function parseForecast(fc){
  // fc: JMA forecast.json（陣列：title + 實況 + 各預報時距）
  const out = { name:null, nameJp:null, number:null, issue:null,
                preTrack:[], track:[], analysis:null, forecasts:[] };
  for(const part of fc){
    if(part.part === 'title'){
      out.name = part.name?.en || null;
      out.nameJp = part.name?.jp || null;
      out.number = part.typhoonNumber || null;
      out.issue = part.issue?.UTC || null;
    } else if(part.advancedHours === 0){
      out.preTrack = part.track?.preTyphoon || [];
      out.track = part.track?.typhoon || [];
      out.analysis = {
        center: part.center,
        validUTC: part.validtime?.UTC || null,
        galeR: part.galeWarningArea?.radius ?? null,          // 公尺
        stormR: part.stormWarningArea?.arc?.[0]?.[1] ?? null  // 公尺（取第一段弧半徑近似）
      };
    } else if(part.center){
      out.forecasts.push({
        hours: part.advancedHours,
        center: part.center,
        validUTC: part.validtime?.UTC || null,
        probR: part.probabilityCircle?.radius ?? null          // 公尺
      });
    }
  }
  out.forecasts.sort((a,b)=>a.hours-b.hours);
  return out;
}

function parseSpecs(sp){
  const out = { category:null, intensity:null, scale:null, byHours:{} };
  for(const part of sp){
    if(part.part === 'title'){ out.category = part.category?.en || null; continue; }
    const h = part.advancedHours;
    if(h === undefined) continue;
    out.byHours[h] = {
      windMs: parseFloat(part.maximumWind?.sustained?.['m/s']) || null,
      gustMs: parseFloat(part.maximumWind?.gust?.['m/s']) || null,
      pressure: parseFloat(part.pressure) || null,
      course: part.course || null,           // 漢字方位，中日通用
      speedKmh: parseFloat(part.speed?.['km/h']) || null,
      location: part.location || null,
      intensity: part.intensity || null,
      category: part.category?.en || null
    };
    if(h === 0){ out.intensity = part.intensity || null; out.scale = part.scale || null; }
  }
  return out;
}

function drawTyphoon(fc, sp){
  const zh = nameZh(fc.name);
  const dispName = zh ? `${zh}颱風` : (fc.name ? `颱風 ${fc.name}` : '熱帶氣旋');

  // 發展期路徑（點狀灰）
  if(fc.preTrack.length > 1)
    L.polyline(fc.preTrack,{color:'#8FA3BD',weight:2,dashArray:'1 6',opacity:.7}).addTo(tcLayer);
  // 實際路徑（黃）
  if(fc.track.length > 1)
    L.polyline(fc.track,{color:'#FFD84F',weight:2.5,opacity:.9}).addTo(tcLayer);

  const cur = fc.analysis?.center;
  if(cur){
    if(fc.analysis.galeR)
      L.circle(cur,{radius:fc.analysis.galeR,color:'#FFB454',weight:1.5,fillColor:'#FFB454',fillOpacity:.07}).addTo(tcLayer);
    if(fc.analysis.stormR)
      L.circle(cur,{radius:fc.analysis.stormR,color:'#FF5D5D',weight:1.8,fillColor:'#FF5D5D',fillOpacity:.10}).addTo(tcLayer);
    L.marker(cur,{icon:L.divIcon({className:'tc-center',html:'<div class="tc-eye"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:500})
      .addTo(tcLayer)
      .bindPopup(`<b>${dispName}</b>（第 ${fc.number} 號）<br>現況中心 ${cur[0].toFixed(1)}°N ${cur[1].toFixed(1)}°E`);
    L.marker(cur,{icon:L.divIcon({className:'',html:`<div class="tc-label">${dispName}</div>`,iconSize:[0,0],iconAnchor:[-12,-10]}),interactive:false}).addTo(tcLayer);
  }

  // 預測路徑與 70% 預報圓
  const fpts = fc.forecasts.filter(f=>f.center);
  if(cur && fpts.length){
    L.polyline([cur, ...fpts.map(f=>f.center)],{color:'#fff',weight:2,dashArray:'6 7',opacity:.85}).addTo(tcLayer);
    for(const f of fpts){
      if(f.probR)
        L.circle(f.center,{radius:f.probR,color:'#fff',weight:1.2,dashArray:'4 5',fillOpacity:0,opacity:.75}).addTo(tcLayer);
      L.marker(f.center,{icon:L.divIcon({className:'',html:'<div class="fc-dot"></div>',iconSize:[9,9],iconAnchor:[4.5,4.5]})})
        .addTo(tcLayer)
        .bindPopup(`<b>+${f.hours} 小時預報</b><br>${fmtTW(f.validUTC)}（台灣時間）<br>${f.center[0].toFixed(1)}°N ${f.center[1].toFixed(1)}°E`);
      L.marker(f.center,{icon:L.divIcon({className:'',html:`<div class="fc-label">${fmtTW(f.validUTC)}</div>`,iconSize:[0,0],iconAnchor:[-8,4]}),interactive:false}).addTo(tcLayer);
    }
  }
}

function buildCard(fc, sp){
  const zh = nameZh(fc.name);
  const now = sp.byHours[0] || {};
  const dispName = zh ? `${zh}颱風` : (fc.name ? `颱風 ${fc.name}` : '熱帶氣旋');
  const cwa = cwaCategory(now.windMs);
  const cur = fc.analysis?.center;

  // 距離與最接近時間
  let distHtml = '', approachHtml = '';
  if(cur){
    const dTn = havKm(cur, TAINAN);
    const near = minDistToTaiwan(cur);
    const dir = bearingZh(TAINAN, cur);
    distHtml = `
      <div class="kv"><label>距台南</label><b>${Math.round(dTn)} <small>km（${dir}方）</small></b></div>
      <div class="kv"><label>距台灣最近點</label><b>${Math.round(near.km)} <small>km（${near.name}）</small></b></div>`;

    let best = null;
    for(const f of fc.forecasts){
      if(!f.center) continue;
      const near2 = minDistToTaiwan(f.center);
      if(!best || near2.km < best.km) best = {...near2, t:f.validUTC, h:f.hours};
    }
    if(best){
      if(best.km < near.km - 30){
        approachHtml = `<div class="approach">依 JMA 預測路徑，約 <b>${fmtTW(best.t)}</b>（台灣時間，+${best.h}h）最接近台灣，屆時距 <b>${best.name}</b> 約 <b>${Math.round(best.km)} km</b>。預報圓表示 70% 機率範圍，實際路徑可能偏移。</div>`;
      } else {
        approachHtml = `<div class="approach">依目前預測路徑，未來 ${fc.forecasts.at(-1)?.hours ?? '—'} 小時內<b>未進一步接近台灣</b>（預測最近約 ${Math.round(best.km)} km）。仍請留意路徑更新。</div>`;
      }
    }

    // 威脅等級
    const stormKm = (fc.analysis.stormR||0)/1000;
    const minNow = near.km, minFc = best ? best.km : near.km;
    let lv = 1;
    if(minNow < stormKm + 60 || minFc < 100) lv = 4;
    else if(minNow < 300 || minFc < 200) lv = 4;
    else if(minFc < 500) lv = 3;
    else if(minFc < 800) lv = 2;
    threatLevel = Math.max(threatLevel, lv);
  }

  const tags = [];
  if(sp.category) tags.push(`<span class="tag">JMA ${CAT_ZH[sp.category]||sp.category}</span>`);
  if(cwa) tags.push(`<span class="${cwa[1]}">${cwa[0]}</span>`);
  if(sp.intensity) tags.push(`<span class="tag warn">強度：${INTENSITY_ZH[sp.intensity]||sp.intensity}</span>`);
  if(sp.scale) tags.push(`<span class="tag">${SCALE_ZH[sp.scale]||sp.scale}</span>`);

  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <h2>${dispName} <span class="en">${(fc.name||'').toUpperCase()} ・ 第 ${fc.number||'—'} 號</span></h2>
    <div class="tags">${tags.join('')}</div>
    <div class="grid">
      <div class="kv"><label>中心氣壓</label><b>${now.pressure ?? '—'} <small>hPa</small></b></div>
      <div class="kv"><label>近中心最大風速</label><b>${now.windMs ?? '—'} <small>m/s</small></b></div>
      <div class="kv"><label>瞬間最大陣風</label><b>${now.gustMs ?? '—'} <small>m/s</small></b></div>
      <div class="kv"><label>移動</label><b>${now.course ?? '—'} <small>${now.speedKmh ?? '—'} km/h</small></b></div>
      <div class="kv"><label>目前位置</label><b style="font-size:12.5px">${locZh(now.location)}</b></div>
      <div class="kv"><label>暴風圈半徑</label><b>${fc.analysis?.stormR ? Math.round(fc.analysis.stormR/1000) : '—'} <small>km</small></b></div>
      ${distHtml}
    </div>
    ${approachHtml}
  `;
  return el;
}

const THREAT_UI = {
  0:['lv0','西北太平洋目前無現役颱風'],
  1:['lv1','遠距觀察中：颱風距台灣尚遠'],
  2:['lv2','持續觀察：預測路徑接近至 800 km 內'],
  3:['lv3','警戒：預測路徑將接近台灣 500 km 內'],
  4:['lv4','嚴重威脅：颱風接近或暴風圈可能觸及台灣']
};

async function loadTyphoons(){
  const panel = document.getElementById('panel');
  tcLayer.clearLayers();
  threatLevel = 0;

  let list;
  try{
    list = await fetchJSON(`${JMA_BASE}/targetTc.json`);
  }catch(e){ showErr('無法取得 JMA 颱風清單：' + e.message); return; }

  const cards = [];
  for(const tc of (Array.isArray(list)?list:[])){
    try{
      const [fcRaw, spRaw] = await Promise.all([
        fetchJSON(`${JMA_BASE}/${tc.tropicalCyclone}/forecast.json`),
        fetchJSON(`${JMA_BASE}/${tc.tropicalCyclone}/specifications.json`)
      ]);
      const fc = parseForecast(fcRaw), sp = parseSpecs(spRaw);
      drawTyphoon(fc, sp);
      cards.push(buildCard(fc, sp));
    }catch(e){ showErr(`讀取 ${tc.tropicalCyclone} 失敗：${e.message}`); }
  }

  panel.innerHTML = '';
  if(cards.length){
    cards.forEach(c=>panel.appendChild(c));
  } else {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="empty"><b>● 目前無現役颱風</b><br>西北太平洋暫無 JMA 監測中的熱帶氣旋。雷達回波持續更新，本頁每 10 分鐘自動重新整理。</div>`;
    panel.appendChild(el);
  }

  // 資料來源卡
  const srcEl = document.createElement('div');
  srcEl.className = 'card';
  srcEl.innerHTML = `<div class="src">
    颱風實況/預報：日本氣象廳（JMA）・雷達：RainViewer<br>
    本頁為輔助監測工具，警報與停班停課請以官方為準：<br>
    <a href="https://www.cwa.gov.tw/V8/C/P/Typhoon/TY_NEWS.html" target="_blank" rel="noopener">中央氣象署 颱風消息</a> ・
    <a href="https://www.jma.go.jp/bosai/map.html#contents=typhoon" target="_blank" rel="noopener">JMA 台風情報</a>
  </div>`;
  panel.appendChild(srcEl);

  const [cls, txt] = THREAT_UI[threatLevel];
  const pill = document.getElementById('threatPill');
  pill.className = cls;
  document.getElementById('threatText').textContent = txt;
  document.getElementById('updated').innerHTML =
    `資料更新 ${fmtTW(new Date().toISOString())} 台灣時間<br>來源 JMA / RainViewer`;
}

/* =========================== 雷達回波動畫 =========================== */
let rvHost=null, rvFrames=[], rvIdx=0, rvLayers={}, rvPlaying=false, rvTimer=null;
const OPACITY = () => document.getElementById('opacitySlider').value / 100;

function rvLayer(i){
  const f = rvFrames[i];
  if(!rvLayers[f.path]){
    rvLayers[f.path] = L.tileLayer(`${rvHost}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,
      {opacity:0, maxZoom:12, tileSize:256});
    rvLayers[f.path].addTo(map);
  }
  return rvLayers[f.path];
}
function rvShow(i){
  rvFrames.forEach((f,k)=>{ if(rvLayers[f.path]) rvLayers[f.path].setOpacity(k===i ? OPACITY() : 0); });
  rvLayer(i).setOpacity(OPACITY());
  rvIdx = i;
  document.getElementById('frameSlider').value = i;
  const t = new Date(rvFrames[i].time * 1000);
  const isFc = rvFrames[i].nowcast;
  document.getElementById('radarTimeMain').textContent =
    (isFc?'▷ ':'') + fmtTW(t.toISOString()).split(' ')[1] + (isFc?'（預測）':'');
}
async function loadRadar(keepIdxAtEnd=true){
  try{
    const idx = await fetchJSON(RV_INDEX);
    rvHost = idx.host;
    const past = (idx.radar?.past||[]).map(f=>({...f, nowcast:false}));
    const fut  = (idx.radar?.nowcast||[]).map(f=>({...f, nowcast:true}));
    // 清掉舊圖層
    Object.values(rvLayers).forEach(l=>map.removeLayer(l));
    rvLayers = {};
    rvFrames = [...past, ...fut];
    const slider = document.getElementById('frameSlider');
    slider.max = Math.max(rvFrames.length - 1, 0);
    if(rvFrames.length){
      const target = keepIdxAtEnd ? past.length - 1 : Math.min(rvIdx, rvFrames.length-1);
      // 預載目前幀與前一幀
      rvLayer(Math.max(target-1,0)); 
      rvShow(Math.max(target,0));
    }
  }catch(e){ showErr('雷達回波載入失敗：' + e.message); }
}
function rvSetPlaying(on){
  rvPlaying = on;
  document.getElementById('playBtn').textContent = on ? '❚❚' : '▶';
  clearInterval(rvTimer);
  if(on){
    rvTimer = setInterval(()=>{ rvShow((rvIdx+1) % rvFrames.length); }, 550);
  }
}
document.getElementById('playBtn').addEventListener('click', ()=> rvSetPlaying(!rvPlaying));
document.getElementById('frameSlider').addEventListener('input', e=>{ rvSetPlaying(false); rvShow(+e.target.value); });
document.getElementById('opacitySlider').addEventListener('input', ()=> rvShow(rvIdx));

/* =========================== 錯誤與更新 =========================== */
let errTimer=null;
function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg + '（可能是網路或來源暫時異常，10 分鐘後自動重試）';
  el.style.display = 'block';
  clearTimeout(errTimer);
  errTimer = setTimeout(()=>{ el.style.display='none'; }, 12000);
}
async function refreshAll(){
  document.getElementById('threatText').textContent = '更新中…';
  await Promise.allSettled([loadTyphoons(), loadRadar()]);
}
document.getElementById('refreshBtn').addEventListener('click', refreshAll);

/* 資訊面板開關：小螢幕預設收合，讓地圖優先 */
const panelBtn = document.getElementById('panelBtn');
function setPanel(show){
  document.body.classList.toggle('panel-hidden', !show);
  panelBtn.classList.toggle('on', show);
  panelBtn.setAttribute('aria-pressed', String(show));
}
panelBtn.addEventListener('click', ()=> setPanel(document.body.classList.contains('panel-hidden')));
setPanel(!window.matchMedia('(max-width:700px)').matches);

setInterval(refreshAll, REFRESH_MS);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshAll(); });

refreshAll();
